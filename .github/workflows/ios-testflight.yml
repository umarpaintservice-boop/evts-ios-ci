name: EVTS iOS build and TestFlight upload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      DRIVE_PART_IDS: ${{ secrets.DRIVE_PART_IDS }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Fetch and unpack Unity Xcode project
        run: bash scripts/fetch_project.sh

      - name: Patch project settings
        run: bash scripts/patch_project.sh

      - name: Archive
        run: bash scripts/archive.sh

      - name: Export and upload to TestFlight
        run: bash scripts/export_upload.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build/*.log
            build/export/*
          if-no-files-found: ignore
